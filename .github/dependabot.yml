# =============================================================================
# Dependabot configuration.
#
# Two ecosystems live in this repo: one npm project (the Angular helpdesk UI)
# and several Maven projects. Each needs its own `updates` entry pointing at the
# directory that holds the manifest.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # Angular frontend (package.json / package-lock.json)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/Java Project 2/Helpdesk Ticket Triage System/helpdesk-triage (Stage 4)/Helpdesk Ticket Triage System/frontend/helpdesk-ui"
    schedule:
      interval: "weekly"
    # Without grouping, a single Angular patch release opens one PR per package
    # (@angular/core, common, compiler, router, ...). That is how this repo ended
    # up with 15 open Dependabot PRs. Grouping collapses them into one.
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "zone.js"
          - "rxjs"
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
      production:
        dependency-type: "production"
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # Maven projects. `directories` (plural) accepts globs, so each stage folder is
  # picked up without listing all fifteen poms by hand.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directories:
      - "/Java Project 1/java-job-tracker/*"
      - "/Java Project 2/Helpdesk Ticket Triage System/*/Helpdesk Ticket Triage System"
      - "/Java Project 2/Helpdesk Ticket Triage System/*/Helpdesk Ticket Triage System/backend"
      - "/Java Project 3/Spring Boot Application/*"
    schedule:
      interval: "weekly"
    groups:
      spring-boot:
        patterns:
          - "org.springframework*:*"
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # Keep the Dockerfiles' base images current (bookmark-api Stages 5 and 6).
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/Java Project 3/Spring Boot Application/bookmark-api (Stage 5)"
      - "/Java Project 3/Spring Boot Application/bookmark-api (Stage 6)"
    schedule:
      interval: "weekly"
    # These images are pinned to Java 21 on purpose: it is an LTS release
    # supported into 2031, and it matches <java.version>21</java.version> in the
    # poms. Left unscoped, Dependabot proposes every new major as it appears —
    # it opened four PRs for Java 24, which is NOT an LTS and carries a
    # six-month support window, so the repo would be back here within months.
    #
    # Patch and minor updates to the 21 line still come through, and that is
    # where the base-image CVE fixes actually live. Moving to the next LTS (25)
    # is a deliberate decision to make, not something to accept from a bot.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
