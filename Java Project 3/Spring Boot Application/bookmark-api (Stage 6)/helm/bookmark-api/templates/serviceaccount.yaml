{{- if .Values.serviceAccount.create -}}
{{/*
A dedicated ServiceAccount. On GKE this is the anchor for Workload Identity —
you bind it to a Google service account so pods can reach Cloud SQL or Secret
Manager without any key file in the image.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bookmark-api.serviceAccountName" . }}
  labels:
    {{- include "bookmark-api.labels" . | nindent 4 }}
{{- end }}
