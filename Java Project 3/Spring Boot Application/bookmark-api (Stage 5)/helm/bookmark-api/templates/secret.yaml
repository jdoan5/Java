{{- if .Values.secretEnv -}}
{{/*
Rendered only when .Values.secretEnv is non-empty. Note that Kubernetes Secrets
are merely base64-ENCODED, not encrypted — anyone with read access to the
namespace can decode them. Fine for learning; for real workloads use GCP Secret
Manager (via External Secrets or Workload Identity) instead of values files.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookmark-api.fullname" . }}
  labels:
    {{- include "bookmark-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
