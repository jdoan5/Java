# Test-only configuration.
#
# This file REPLACES src/main/resources/application.yml for the test run; the two are NOT
# merged. Spring Boot loads the first application.yml it finds on the classpath, and Maven
# puts target/test-classes ahead of target/classes, so anything the main file sets and this
# one omits falls back to the Spring Boot DEFAULT, not to the main file's value. (Observed:
# the main file exposes health + info actuator endpoints; the tests see the default of
# health alone.) Add a key here if a test needs to depend on it.
#
# The database is a separate in-memory H2 (helpdesk-test) rebuilt from scratch each run.
# The dev datasource is in-memory too, so this is not about stale dev data — the point is
# that tests get their own named database, so a locally running app cannot contend with the
# test run, and ddl-auto: create-drop rebuilds the schema from the entities every time
# instead of migrating whatever was there before.
spring:
  datasource:
    url: jdbc:h2:mem:helpdesk-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
